[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde_json = "1.0.151"
dotenv = "0.15.0"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros"] }
sqlx = {version = "0.8.6", features = ["postgres", "macros", "runtime-tokio", "rust_decimal", "chrono", "uuid"]}
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }